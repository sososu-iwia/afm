services:
  postgres:
    image: postgres:16-alpine
    container_name: kendala-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kendala}
      POSTGRES_USER: ${POSTGRES_USER:-kendala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kendala-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kendala} -d ${POSTGRES_DB:-kendala}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kendala-postgres-data:
