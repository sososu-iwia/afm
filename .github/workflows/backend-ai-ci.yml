name: AFM CI

on:
  push:
    paths:
      - "backend-java/**"
      - "frontend/**"
      - "ai-service/**"
      - "performance/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-ai-ci.yml"
  pull_request:
    paths:
      - "backend-java/**"
      - "frontend/**"
      - "ai-service/**"
      - "performance/**"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-ai-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kendala_ci
          POSTGRES_USER: kendala_ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kendala_ci -d kendala_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Verify backend
        working-directory: backend-java
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Verify Flyway against PostgreSQL service
        working-directory: backend-java
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kendala_ci
          SPRING_DATASOURCE_USERNAME: kendala_ci
          SPRING_DATASOURCE_PASSWORD: ci_password
          APP_JWT_SECRET: Y2ktand0LXNlY3JldC1hdC1zZWNyZXQtYXQtbGVhc3Qtc2l4dHktZm91ci1jaGFyYWN0ZXJzLWxvbmc=
          APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
          APP_SMS_PROVIDER: smsc
          SMSC_LOGIN: ci
          SMSC_PASSWORD: ci
          APP_STORAGE_PROVIDER: local
          APP_STORAGE_LOCAL_PATH: /tmp/kendala-ci-storage
          AI_INTERNAL_API_KEY: ci-internal-key
        run: |
          java -jar target/kendala-backend-*.jar >/tmp/kendala-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat /tmp/kendala-backend.log
              exit 1
            fi
            sleep 2
          done
          PGPASSWORD=ci_password psql \
            --host=127.0.0.1 \
            --username=kendala_ci \
            --dbname=kendala_ci \
            --command="SELECT version, success FROM flyway_schema_history ORDER BY installed_rank;"

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend-java/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend when configured
        working-directory: frontend
        run: npm run test --if-present -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install AI dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile AI Python
        working-directory: ai-service
        run: python3 -m py_compile api/*.py models/*.py

      - name: Test AI
        working-directory: ai-service
        run: pytest --junitxml=test-results/pytest.xml

      - name: Upload AI test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-reports
          path: ai-service/test-results/

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - ai
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t afm-backend-ci ./backend-java

      - name: Build frontend image when configured
        if: ${{ hashFiles('frontend/Dockerfile') != '' }}
        run: docker build -t afm-frontend-ci ./frontend

      - name: Build AI image
        run: docker build -t afm-ai-ci ./ai-service

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: kendala
      POSTGRES_USER: kendala
      POSTGRES_PASSWORD: ci_password
      APP_JWT_SECRET: Y2ktand0LXNlY3JldC1zZWNyZXQtYXQtbGVhc3Qtc2l4dHktZm91ci1jaGFyYWN0ZXJzLWxvbmc=
      APP_CORS_ALLOWED_ORIGINS: https://example.invalid
      SMSC_LOGIN: ci
      SMSC_PASSWORD: ci
      APP_STORAGE_PROVIDER: local
      AI_INTERNAL_API_KEY: ci-internal-key
      OPENAI_API_KEY: ci-placeholder
      AI_ALLOWED_ORIGINS: http://backend:8080
      MAIL_HOST: mail.invalid
      MAIL_USERNAME: ci
      MAIL_PASSWORD: ci
      MAIL_FROM: no-reply@example.invalid
    steps:
      - uses: actions/checkout@v4

      - name: Validate development Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
