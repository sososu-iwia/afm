spring:
  application:
    name: kendala-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kendala}
    username: ${SPRING_DATASOURCE_USERNAME:kendala}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: ${APP_MAX_FORM_POST_SIZE:1MB}
    max-swallow-size: ${APP_MAX_SWALLOW_SIZE:25MB}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  request:
    max-body-bytes: ${APP_REQUEST_MAX_BODY_BYTES:1048576}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl-seconds: ${APP_JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${APP_JWT_REFRESH_TTL_SECONDS:2592000}
  otp:
    ttl-seconds: ${APP_OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${APP_OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
  sms:
    provider: ${APP_SMS_PROVIDER:}
  storage:
    provider: ${APP_STORAGE_PROVIDER}
    local:
      path: ${APP_STORAGE_LOCAL_PATH:}
  document:
    max-size-bytes: ${APP_DOCUMENT_MAX_SIZE_BYTES:10485760}
  pdf:
    unicode-font-path: ${APP_PDF_UNICODE_FONT_PATH:}
  auth-rate-limit:
    phone-max: ${APP_AUTH_PHONE_MAX:10}
    ip-max: ${APP_AUTH_IP_MAX:30}
    window-seconds: ${APP_AUTH_RATE_WINDOW_SECONDS:900}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    internal-api-key: ${AI_INTERNAL_API_KEY:}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:3}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:30}
    failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-seconds: ${AI_CIRCUIT_OPEN_SECONDS:30}
    max-attempts: ${AI_MAX_ATTEMPTS:3}
    retry-base-millis: ${AI_RETRY_BASE_MILLIS:200}
    retry-max-millis: ${AI_RETRY_MAX_MILLIS:5000}
    lease-seconds: ${AI_LEASE_SECONDS:120}
    recovery-enabled: ${AI_RECOVERY_ENABLED:true}
    recovery-delay-ms: ${AI_RECOVERY_DELAY_MS:30000}
  notifications:
    enabled: ${APP_NOTIFICATIONS_ENABLED:false}
    email-from: ${MAIL_FROM:}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    recovery-delay-ms: ${NOTIFICATION_RECOVERY_DELAY_MS:30000}
    retry-base-seconds: ${NOTIFICATION_RETRY_BASE_SECONDS:5}
    retry-max-seconds: ${NOTIFICATION_RETRY_MAX_SECONDS:300}
  idempotency:
    ttl-seconds: ${IDEMPOTENCY_TTL_SECONDS:86400}
    cleanup-cron: ${IDEMPOTENCY_CLEANUP_CRON:0 17 * * * *}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,storage
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
