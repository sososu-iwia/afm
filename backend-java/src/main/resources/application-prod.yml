spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  sms:
    provider: ${APP_SMS_PROVIDER}
  storage:
    provider: ${APP_STORAGE_PROVIDER}
    local:
      path: ${APP_STORAGE_LOCAL_PATH:}
  ai:
    base-url: ${AI_SERVICE_URL}
    internal-api-key: ${AI_INTERNAL_API_KEY}
  notifications:
    enabled: ${APP_NOTIFICATIONS_ENABLED:true}
    email-from: ${MAIL_FROM}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,storage
        liveness:
          include: livenessState

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlationId:-}","actorRole":"%X{actorRole:-}","operation":"%X{operation:-}","result":"%X{result:-}","durationMs":"%X{durationMs:-}","message":"%replace(%m){''"'',''\\"''}"}%n'
