spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0cy1vbmx5LW11c3QtYmUtbG9uZw==
    access-ttl-seconds: 60
    refresh-ttl-seconds: 3600
  otp:
    ttl-seconds: 300
    resend-cooldown-seconds: 1
    max-attempts: 5
  auth-rate-limit:
    phone-max: 1000
    ip-max: 10000
    window-seconds: 900
  sms:
    provider: fake
  storage:
    provider: local
    local:
      path: /tmp/kendala-test-uploads
  document:
    max-size-bytes: 1024
  ai:
    base-url: http://localhost:1
    internal-api-key: test-internal-key
    max-attempts: 3
    lease-seconds: 30
    recovery-enabled: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,storage
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
