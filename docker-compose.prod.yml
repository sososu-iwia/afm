services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kendala-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./ai-service
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: ${AI_MEMORY_LIMIT:-1g}
    cpus: ${AI_CPU_LIMIT:-1.0}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      AI_ENV: production
      AI_PUBLIC_ENDPOINTS_ENABLED: "false"
      AI_MAX_UPLOAD_BYTES: ${AI_MAX_UPLOAD_BYTES:-10485760}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      AI_ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}

  backend:
    build:
      context: ./backend-java
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_BOOTSTRAP_ADMIN_PHONE: ${APP_BOOTSTRAP_ADMIN_PHONE:-}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-Администратор системы}
      APP_SMS_PROVIDER: smsc
      SMSC_LOGIN: ${SMSC_LOGIN}
      SMSC_PASSWORD: ${SMSC_PASSWORD}
      SMSC_SENDER: ${SMSC_SENDER:-}
      APP_NOTIFICATIONS_ENABLED: "true"
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER}
      APP_STORAGE_LOCAL_PATH: ${APP_STORAGE_LOCAL_PATH:-/app/storage}
      APP_PDF_UNICODE_FONT_PATH: ${APP_PDF_UNICODE_FONT_PATH:-/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      AI_SERVICE_URL: http://ai:8001
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
    volumes:
      - kendala-file-storage:/app/storage
    ports:
      - "127.0.0.1:${JAVA_APP_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    user: "101:101"
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:8080"

volumes:
  kendala-postgres-data:
  kendala-file-storage:
